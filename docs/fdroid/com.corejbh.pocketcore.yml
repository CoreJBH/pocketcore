MaintainerNotes: |
  The apk is an ordinary Gradle build; the only unusual part is the daemon.

  bitcoind is not a prebuilt binary in the repository: the file at
  app/src/main/jniLibs/arm64-v8a/libbitcoind.so is removed by rm: before the
  scan, and scripts/build-bitcoind-android.sh rebuilds it from source during the
  build: phase (not prebuild:, which runs before the binary scan and would be
  rejected). The script produces a position-independent aarch64 ELF executable,
  strips it with llvm-strip and writes it to that path with mode 0755, which is
  where the app executes it from nativeLibraryDir. Gradle packages it as a
  native library with useLegacyPackaging, so the APK build itself is untouched.

  Inputs the build needs offline:
    - Bitcoin Core v32.1 source: srclibs bitcoincore@v32.1, added by
      srclibs/bitcoincore.yml (https://github.com/bitcoin/bitcoin.git). The
      GitHub tag carries the leveldb/crc32c/minisketch/secp256k1 subtrees, so no
      submodules are needed.
    - Boost headers: libboost-dev from Debian. Bitcoin Core 32.1 needs Boost
      1.74.0 or later for headers only (no compiled Boost library, no libevent);
      the build passes BOOST_SRC=/usr/include so the script uses the packaged
      headers instead of downloading the upstream archive.
    - NDK r30 (30.0.16248370) through the ndk: field; the script reads
      ANDROID_NDK_HOME=$$NDK$$.

  Upstream download hashes, for reference: bitcoin-32.1.tar.gz
  a5f2f61e32cf7f790641c9ec306a3c88ca7b5a556946956b1f35ffd7e27813f9,
  boost_1_86_0.tar.gz
  2575e74ffc3ef1cd0babac2c1ee8bdb5782a0ee672b1912da40e5b4b591ca01f. When the
  script runs with network access it fetches exactly these and verifies both.

  The stripped daemon of versionCode 10 is 10,729,904 bytes, SHA-256
  6becfe26657d216dc84161f9f9c0e4beb6f76634ed6f74d1a8330719a8c74f02, and the
  whole build record is in docs/BUILD-RECORD.md. Different NDK or Boost
  revisions can change those bytes without changing behaviour; that is expected
  for a source build and is why the hash is not asserted.

  app/src/main/assets/ipv4_country.bin is a compressed IPv4-to-country table
  generated by tools/build-geoip-asset.py from the DB-IP IP-to-Country Lite
  database (CC BY 4.0, attribution in assets/ipv4_country_NOTICE.txt); it is
  data, not code, and the app reads it offline instead of calling a geolocation
  service.

  No anti-features: no tracking, no ads, no non-free dependencies, no Google
  Play Services. The app talks to the Bitcoin peer-to-peer network and to its
  own loopback JSON-RPC endpoint, nothing else.

  The release keystore is not in the repository and is not needed: the gradle
  build leaves the release APK unsigned when keystore/ is absent.
